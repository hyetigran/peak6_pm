[package]
name = "meridian"
version = "0.1.0"
edition = "2021"
description = "Meridian — same-day MAG7 binary Outcome Markets on Solana (V1). Devnet only."

[lib]
crate-type = ["cdylib", "lib"]
name = "meridian"

[features]
default = []
# `localnet` relaxes the schedule/settlement timing floors AND supplies the
# mock feed read in finalize_settlement. The strict/default (devnet) build
# compiles that read out, so until the Switchboard adapter lands (#16) it uses
# the instruction args; it also enforces the real settlement-delay floors and
# bounds the trading session (ADR-0033) rather than pinning 3.5h/6.5h.
# Localnet is for tests + demo only.
localnet = []
cpi = ["no-entrypoint"]
no-entrypoint = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
