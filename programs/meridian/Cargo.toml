[package]
name = "meridian"
version = "0.1.0"
edition = "2021"
description = "Meridian — same-day MAG7 binary Outcome Markets on Solana (V1). Devnet only."

[lib]
crate-type = ["cdylib", "lib"]
name = "meridian"

[features]
default = []
# `localnet` relaxes ONLY the timing floors: it bounds the trading session
# (ADR-0033) rather than pinning 3.5h/6.5h and drops the settlement-delay floors
# so the demo can run in one sitting. Both builds READ the Official Close from
# the owner-pinned delivery feed (finalize_settlement) — never from the caller;
# only the feed's writer differs (harness mock on localnet, the Pyth adapter
# normalizer on devnet, #16). Localnet is for tests + demo only.
localnet = []
cpi = ["no-entrypoint"]
no-entrypoint = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
