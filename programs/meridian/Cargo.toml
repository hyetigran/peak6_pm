[package]
name = "meridian"
version = "0.1.0"
edition = "2021"
description = "Meridian — same-day MAG7 binary Outcome Markets on Solana (V1). Devnet only."

[lib]
crate-type = ["cdylib", "lib"]
name = "meridian"

[features]
default = []
# Relaxes ONLY schedule/settlement timing floors for localnet tests + demo.
# The default (devnet) build enforces the real 3.5h/6.5h sessions and delays.
localnet = []
cpi = ["no-entrypoint"]
no-entrypoint = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
