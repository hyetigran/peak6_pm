[package]
name = "meridian"
version = "0.1.0"
edition = "2021"
description = "Meridian — same-day MAG7 binary Outcome Markets on Solana (V1). Devnet only."

[lib]
crate-type = ["cdylib", "lib"]
name = "meridian"

[features]
default = []
# `localnet` relaxes ONLY time-based checks: it bounds the trading session
# (ADR-0033) rather than pinning 3.5h/6.5h, drops the settlement-delay floors,
# and skips the Settlement Quality Predicate close window on observed_ts
# (ADR-0034 §Capture window) — so the demo can settle synthetic closes in one
# sitting. Both builds READ the Official Close (and observed_ts) from the
# owner-pinned delivery feed (finalize_settlement) — never from the caller;
# only the feed's writer differs (harness mock on localnet, the Pyth adapter
# on devnet, #26). Localnet is for tests + demo only.
localnet = []
cpi = ["no-entrypoint"]
no-entrypoint = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
